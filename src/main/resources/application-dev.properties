# Local development: H2 file database under ./data, e-mails written to the log, demo company seeded.
spring.datasource.url=jdbc:h2:file:./data/kosh;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.mail.transport=log
# The e-mail body (invite and password links) is logged at DEBUG, so only dev prints it.
logging.level.com.kosh.notification.LoggingMailService=DEBUG
app.seed-demo=true
# Dev-only AES-256 key for the local H2 data. Never use it anywhere else: the mysql profile reads APP_DATA_KEY.
app.data-key=kpWn1TbE2tBO1DnwRX28s8j1oWaO4LLq8bFLisaR7J4=
