spring.application.name=Kosh
# No profile given means local development. Tests run on "test" (@ActiveProfiles, Surefire as backstop), production on "mysql".
spring.profiles.default=dev

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.compression.enabled=true
server.compression.min-response-size=1KB
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
# Branded error pages replace Spring's whitelabel page (T03). Boot 4 moved this key from server.error.*.
spring.web.error.whitelabel.enabled=false

# Uploads are capped at 5 MB per file; the request limit leaves room for the multipart envelope and form fields.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Tomcat refuses a larger upload with 413 (templates/error/413.html). It reads and discards the rest of the body
# first, up to this size; past it the connection is cut and the browser shows "connection reset" instead of the page.
server.tomcat.max-swallow-size=20MB

# Devtools turns the H2 console on by default; only application-dev.properties may enable it.
spring.h2.console.enabled=false

app.brand=Kosh
app.zone=Asia/Kolkata
app.upload-dir=./uploads
app.seed-demo=false
app.base-url=http://localhost:8080
app.mail.from=no-reply@kosh.test

# First admin, and recovery when nobody can sign in as admin (AdminBootstrap): set both, start once, sign in, then
# remove them. Ignored while an active admin exists.
app.admin-bootstrap.email=${ADMIN_EMAIL:}
app.admin-bootstrap.password=${ADMIN_PASSWORD:}
