# MySQL 8 with real SMTP. Every secret and address comes from environment variables; see .env.example.

# spring-boot:run keeps devtools active, and its defaults put stack traces, exception messages and rejected values
# (PAN, bank account) into error responses and persist sessions to disk. Real data never gets those defaults.
spring.devtools.add-properties=false
# The LiveReload server binds port 35729 on every interface with no authentication.
spring.devtools.livereload.enabled=false
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

app.data-key=${APP_DATA_KEY}
app.seed-demo=${SEED_DEMO:false}
# No fallbacks for the base URL and sender: a forgotten variable stops startup instead of mailing localhost links.
app.base-url=${APP_BASE_URL}
app.upload-dir=${UPLOAD_DIR:./uploads}

app.mail.transport=smtp
app.mail.from=${MAIL_FROM}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Without this a server (or attacker) that drops STARTTLS from EHLO gets the password and mail in plain text.
spring.mail.properties.mail.smtp.starttls.required=true
# JavaMail waits forever by default; a stuck SMTP server must not hold request threads.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
