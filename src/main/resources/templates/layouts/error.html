<!DOCTYPE html>
<!-- The error card inside the public layout, for error/403, 404, 500 and the generic error page.
     Use: <html th:replace="~{layouts/error :: page(code='404', title='Page not found', heading='…', message=~{::message})}"> -->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="page(code, title, heading, message)"
	th:replace="~{layouts/public :: layout(title=${title}, content=~{::error-content})}">
<body>
	<div class="error-main" th:fragment="error-content">
		<section class="error-card" aria-labelledby="error-heading">
			<p class="error-card__code" th:text="'Error ' + ${code}">Error 404</p>
			<h1 class="error-card__heading" id="error-heading" th:text="${heading}">Page not found</h1>
			<th:block th:replace="${message}"></th:block>
			<a class="btn btn-primary" th:href="@{/}">Go to the home page</a>
		</section>
	</div>
</body>
</html>
