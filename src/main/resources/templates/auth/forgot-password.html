<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{layouts/public :: layout(title='Reset your password', content=~{::content})}">
<body>
<div class="auth-main" th:fragment="content">
	<section class="card auth-card" aria-labelledby="forgot-title">
		<h1 class="auth-title" id="forgot-title">Reset your password</h1>
		<p class="auth-lede">Enter the work email you sign in with. We’ll email you a link to choose a new password.</p>
		<form class="auth-form" method="post" th:action="@{/password/forgot}" th:object="${form}" novalidate>
			<div class="field" th:with="invalid=${#fields.hasErrors('email')}">
				<label class="label" for="email">Work email</label>
				<input class="input" id="email" name="email" type="email" autocomplete="username" maxlength="254" required
					autofocus th:value="*{email}"
					th:attr="aria-invalid=${invalid} ? 'true', aria-describedby=${invalid} ? 'email-error'">
				<p class="error-text" id="email-error" th:if="${invalid}">
					<svg th:replace="~{fragments/icon :: icon('alert')}"></svg><span th:text="${#strings.listJoin(#fields.errors('email'), ' ')}">Enter your work email.</span>
				</p>
			</div>
			<button class="btn btn-primary auth-submit" type="submit">Email me a link</button>
		</form>
		<p class="auth-foot">Remembered it? <a th:href="@{/login}">Sign in</a></p>
	</section>
	<p class="auth-help">No access to that mailbox any more? Ask HR or your Kosh administrator to update your account.</p>
</div>
</body>
</html>
