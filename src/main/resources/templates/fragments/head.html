<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!-- Shared <head>: page title "<title> | Kosh", favicon, preloaded body fonts, tokens and components, htmx, the
     <dialog> command fallback (commands.js) for modals and drawers, and show/hide for password fields.
     Use: <head th:replace="~{fragments/head :: head(title='Employees', extra=~{})}">; pass extra=~{::name} for page assets.
     htmx and its config are deferred, so htmx-config.js runs before htmx initialises on DOMContentLoaded.
     The CSRF meta tags are for htmx requests and only written for signed-in users, so public pages create no session. -->
<head th:fragment="head(title, extra)">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title} + ' | Kosh'">Kosh</title>
	<th:block th:if="${_csrf != null}" sec:authorize="isAuthenticated()">
		<meta name="_csrf" th:content="${_csrf.token}">
		<meta name="_csrf_header" th:content="${_csrf.headerName}">
	</th:block>
	<link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
	<link rel="preload" as="font" type="font/woff2" crossorigin th:href="@{/fonts/ibm-plex-sans-latin-400-normal.woff2}">
	<link rel="preload" as="font" type="font/woff2" crossorigin th:href="@{/fonts/ibm-plex-sans-latin-600-normal.woff2}">
	<link rel="stylesheet" th:href="@{/css/tokens.css}">
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
	<script th:src="@{/js/htmx-config.js}" defer></script>
	<script th:src="@{/js/commands.js}" defer></script>
	<script th:src="@{/js/password-toggle.js}" defer></script>
	<th:block th:replace="${extra}"></th:block>
</head>
</html>
