# Tests: in-memory H2 in MySQL mode, e-mails to the log, no demo data.
# app.data-key is not set here on purpose: TestDataKeyEnvironmentPostProcessor generates a fresh key per test run.
spring.datasource.url=jdbc:h2:mem:kosh;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

app.mail.transport=log
app.seed-demo=false
# Tests share one in-memory database: never bootstrap an admin from ADMIN_EMAIL/ADMIN_PASSWORD in the developer's shell.
app.admin-bootstrap.email=
app.admin-bootstrap.password=
